<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Backend B — Manna Vom Himmel Workspace</title><style>:root{color-scheme:dark;--bar:rgba(7,18,34,.84);--line:rgba(255,255,255,.18);--gold:#d4a043;--text:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071222;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}.stage{position:relative;width:100vw;line-height:0;user-select:none}.stage img{display:block;width:100%;height:auto}.hotspot{position:absolute;display:block;z-index:5;cursor:pointer;border:0;background:transparent}.debug .hotspot{outline:2px solid #f44;background:rgba(255,70,70,.12)}.debug .hotspot::after{content:attr(data-label);position:absolute;left:2px;top:2px;padding:2px 5px;line-height:1.2;font-size:10px;color:#fff;background:#c22;border-radius:3px;white-space:nowrap}.toolbar{position:fixed;z-index:20;right:14px;bottom:14px;display:flex;gap:6px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:12px;background:var(--bar);backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.32)}.toolbar button,.toolbar a{border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font:600 12px/1 system-ui;padding:8px 10px;border-radius:8px;cursor:pointer;text-decoration:none}.toolbar .name{line-height:1.1;color:#dce7f5;font-size:11px;padding:0 6px}.gold{color:#ffcf76}.compact .name,.compact .navbtn{display:none}.compact{opacity:.2}.compact:hover{opacity:1}</style></head><body><main id="stage" class="stage"><img id="screen"></main><div class="toolbar" id="toolbar"><a href="index.html">⌂</a><button class="navbtn" id="prev">←</button><span class="name"><b class="gold" id="counter"></b> · <span id="screenName"></span></span><button class="navbtn" id="next">→</button><button id="debug">◎</button><button id="hidebar">×</button></div><script>const cfg={title:'Backend B — Manna Vom Himmel Workspace',start:'desktop',pages:{desktop:{label:'Desktop',file:'UI/ChatGPT Image 10. Sept. 2026, 19_44_41 (1).png'},projekte:{label:'Projekte',file:'UI/ChatGPT Image 10. Sept. 2026, 19_29_45 (2).png'},kalender:{label:'Kalender & Planung',file:'UI/ChatGPT Image 10. Sept. 2026, 19_29_44 (1).png'},aufgaben:{label:'Aufgaben',file:'UI/ChatGPT Image 10. Sept. 2026, 19_29_45 (3).png'},import:{label:'Import Center',file:'UI/ChatGPT Image 10. Sept. 2026, 19_29_46 (4).png'},ki:{label:'KI-Assistent',file:'UI/ChatGPT Image 10. Sept. 2026, 19_29_46 (5).png'}},commonHotspots:[{x:0,y:14,w:14.5,h:5.5,target:'desktop',label:'Desktop'},{x:0,y:19.5,w:14.5,h:5.5,target:'projekte',label:'Projekte'},{x:0,y:25,w:14.5,h:5.5,target:'kalender',label:'Kalender'},{x:0,y:30.5,w:14.5,h:5.5,target:'aufgaben',label:'Aufgaben'},{x:0,y:59,w:14.5,h:5.5,target:'ki',label:'KI-Assistent'},{x:0,y:64,w:14.5,h:5.5,target:'import',label:'Import Center'}]};const stage=document.getElementById('stage'),img=document.getElementById('screen'),nameEl=document.getElementById('screenName'),counter=document.getElementById('counter'),keys=Object.keys(cfg.pages);let current='';function path(p){return p.split('/').map((s,i)=>i?encodeURIComponent(s):s).join('/')}function hs(a){let e=document.createElement('a');e.className='hotspot';e.href='#'+a.target;e.dataset.label=a.label;Object.assign(e.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%'});e.onclick=v=>{v.preventDefault();setPage(a.target)};stage.appendChild(e)}function render(){stage.querySelectorAll('.hotspot').forEach(e=>e.remove());cfg.commonHotspots.forEach(hs)}function setPage(k,p=true){if(!cfg.pages[k])k=keys[0];current=k;let d=cfg.pages[k],i=keys.indexOf(k);img.src=path(d.file);nameEl.textContent=d.label;counter.textContent=(i+1)+'/'+keys.length;document.title=cfg.title+' — '+d.label;render();if(p)history.replaceState(null,'','#'+k)}function step(d){let i=(keys.indexOf(current)+d+keys.length)%keys.length;setPage(keys[i])}prev.onclick=()=>step(-1);next.onclick=()=>step(1);debug.onclick=()=>document.body.classList.toggle('debug');hidebar.onclick=()=>toolbar.classList.toggle('compact');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(e.key.toLowerCase()==='d')document.body.classList.toggle('debug')});setPage(location.hash.slice(1)||cfg.start,false)</script></body></html>
