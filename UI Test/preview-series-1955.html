<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Zusätzliche UI-Serie 19:55</title><style>:root{color-scheme:dark;--bar:rgba(7,18,34,.84);--line:rgba(255,255,255,.18);--gold:#d4a043;--text:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071222;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}.stage{position:relative;width:100vw;line-height:0;user-select:none}.stage img{display:block;width:100%;height:auto}.toolbar{position:fixed;z-index:20;right:14px;bottom:14px;display:flex;gap:6px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:12px;background:var(--bar);backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.32)}.toolbar button,.toolbar a{border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font:600 12px/1 system-ui;padding:8px 10px;border-radius:8px;cursor:pointer;text-decoration:none}.name{line-height:1.1;color:#dce7f5;font-size:11px;padding:0 6px}.gold{color:#ffcf76}.compact .name,.compact .navbtn{display:none}.compact{opacity:.2}.compact:hover{opacity:1}</style></head><body><main class="stage"><img id="screen" decoding="async"></main><div class="toolbar" id="toolbar"><a href="index.html">⌂</a><button class="navbtn" id="prev">←</button><span class="name"><b class="gold" id="counter"></b> · <span id="screenName"></span></span><button class="navbtn" id="next">→</button><button id="hidebar">×</button></div><script>const pages=[['Ansicht 1','UI/ChatGPT Image 10. Sept. 2026, 19_55_30 (1).png'],['Ansicht 2','UI/ChatGPT Image 10. Sept. 2026, 19_55_31 (2).png'],['Ansicht 3','UI/ChatGPT Image 10. Sept. 2026, 19_55_31 (3).png'],['Ansicht 4','UI/ChatGPT Image 10. Sept. 2026, 19_55_31 (4).png'],['Ansicht 5','UI/ChatGPT Image 10. Sept. 2026, 19_55_32 (5).png'],['Ansicht 6','UI/ChatGPT Image 10. Sept. 2026, 19_55_33 (6).png'],['Ansicht 7','UI/ChatGPT Image 10. Sept. 2026, 19_55_34 (7).png'],['Ansicht 8','UI/ChatGPT Image 10. Sept. 2026, 19_55_34 (8).png'],['Ansicht 9','UI/ChatGPT Image 10. Sept. 2026, 19_55_35 (9).png']];let i=0;const img=document.getElementById('screen'),n=document.getElementById('screenName'),c=document.getElementById('counter');function path(p){return p.split('/').map((s,j)=>j?encodeURIComponent(s):s).join('/')}function show(x){i=(x+pages.length)%pages.length;img.src=path(pages[i][1]);n.textContent='Serie 19:55 — '+pages[i][0];c.textContent=(i+1)+'/'+pages.length;location.hash='screen'+(i+1)}prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);hidebar.onclick=()=>toolbar.classList.toggle('compact');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1)});const h=parseInt(location.hash.replace('#screen',''),10);show(Number.isFinite(h)?h-1:0)</script></body></html>
