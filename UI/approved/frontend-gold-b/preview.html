<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manna Vom Himmel — Approved UI · Gold Editorial B</title>
<style>
:root{color-scheme:dark;--bar:rgba(7,18,34,.86);--line:rgba(255,255,255,.18);--gold:#d4a043;--text:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071222;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}.stage{position:relative;width:100vw;line-height:0;user-select:none}.stage img{display:block;width:100%;height:auto}.hotspot{position:absolute;display:block;z-index:5;cursor:pointer;border:0;background:transparent;text-decoration:none}.debug .hotspot{outline:2px solid rgba(255,70,70,.85);background:rgba(255,70,70,.12)}.debug .hotspot::after{content:attr(data-label);position:absolute;left:2px;top:2px;padding:2px 5px;line-height:1.2;font-size:10px;color:#fff;background:#d22;border-radius:3px;white-space:nowrap}.toolbar{position:fixed;z-index:20;right:14px;bottom:14px;display:flex;gap:6px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:12px;background:var(--bar);backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.32)}.toolbar button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);font:600 12px/1 system-ui;padding:8px 10px;border-radius:8px;cursor:pointer}.toolbar button:hover{background:rgba(255,255,255,.16)}.toolbar .name{line-height:1.1;color:#dce7f5;font-size:11px;padding:0 6px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolbar .gold{color:#ffcf76}@media(max-width:700px){.toolbar{right:8px;bottom:8px}.toolbar .name{display:none}}
</style>
</head>
<body>
<main id="stage" class="stage"><img id="screen" decoding="async" fetchpriority="high"></main>
<div class="toolbar"><button id="prev" title="Vorherige Ansicht">←</button><span class="name"><b class="gold" id="counter"></b> · <span id="screenName"></span></span><button id="next" title="Nächste Ansicht">→</button><button id="debug" title="Hotspots anzeigen">◎</button></div>
<script>
const CONFIG={
 title:'Manna Vom Himmel — Approved UI · Gold Editorial B',
 pages:{
  start:{label:'Startseite',file:'01-start.png'},
  videos:{label:'Videos',file:'02-videos.png'},
  video:{label:'Video Detail',file:'03-video-detail.png'},
  beitraege:{label:'Beiträge',file:'04-beitraege.png'},
  beitrag:{label:'Beitrag Detail',file:'05-beitrag-detail.png'},
  buecher:{label:'Bücher & PDF',file:'06-buecher.png'},
  buch:{label:'Buch Detail',file:'07-buch-detail.png'},
  live:{label:'Live',file:'08-live.png'},
  podcast:{label:'Podcast',file:'09-podcast.png'},
  community:{label:'Community',file:'10-community.png'}
 },
 commonHotspots:[
  {x:21.5,y:0,w:4.4,h:7.2,target:'start',label:'Start'},
  {x:25.8,y:0,w:4.7,h:7.2,target:'videos',label:'Videos'},
  {x:30.4,y:0,w:5,h:7.2,target:'beitraege',label:'Beiträge'},
  {x:35.3,y:0,w:4.6,h:7.2,target:'buecher',label:'Bücher'},
  {x:39.8,y:0,w:6.1,h:7.2,target:'live',label:'Livestreams'},
  {x:45.8,y:0,w:5.1,h:7.2,target:'podcast',label:'Podcast'},
  {x:50.8,y:0,w:5.8,h:7.2,target:'community',label:'Community'}
 ],
 pageHotspots:{
  videos:[{x:49,y:9,w:36,h:29,target:'video',label:'Featured Video öffnen'},{x:4,y:45,w:24,h:25,target:'video',label:'Video öffnen'}],
  beitraege:[{x:49,y:8,w:36,h:30,target:'beitrag',label:'Featured Beitrag öffnen'},{x:3,y:43,w:25,h:27,target:'beitrag',label:'Beitrag öffnen'}],
  buecher:[{x:3,y:48,w:43,h:26,target:'buch',label:'Buch öffnen'}],
  start:[{x:49,y:9,w:36,h:31,target:'video',label:'Featured Video öffnen'},{x:74,y:54,w:22,h:28,target:'live',label:'Livestream öffnen'}]
 }
};
const stage=document.getElementById('stage'),img=document.getElementById('screen'),nameEl=document.getElementById('screenName'),counter=document.getElementById('counter'),keys=Object.keys(CONFIG.pages);let current='';function hs(a){const e=document.createElement('a');e.className='hotspot';e.href='#'+a.target;e.dataset.label=a.label||a.target;e.setAttribute('aria-label',a.label||a.target);Object.assign(e.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%'});e.onclick=ev=>{ev.preventDefault();setPage(a.target)};stage.appendChild(e)}function renderHotspots(){stage.querySelectorAll('.hotspot').forEach(e=>e.remove());CONFIG.commonHotspots.forEach(hs);(CONFIG.pageHotspots[current]||[]).forEach(hs)}function setPage(key){if(!CONFIG.pages[key])key=keys[0];current=key;const p=CONFIG.pages[key];img.src=p.file;img.alt=p.label;nameEl.textContent=p.label;document.title=CONFIG.title+' — '+p.label;renderHotspots();counter.textContent=(keys.indexOf(key)+1)+'/'+keys.length;history.replaceState(null,'','#'+key)}function step(d){let i=(keys.indexOf(current)+d+keys.length)%keys.length;setPage(keys[i])}document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);document.getElementById('debug').onclick=()=>document.body.classList.toggle('debug');window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(e.key.toLowerCase()==='d')document.body.classList.toggle('debug')});setPage(decodeURIComponent(location.hash.slice(1))||'start');
</script>
</body>
</html>
