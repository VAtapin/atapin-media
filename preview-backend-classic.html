<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Backend A — Classic Media Desktop</title><style>:root{color-scheme:dark;--bar:rgba(7,18,34,.84);--line:rgba(255,255,255,.18);--gold:#d4a043;--text:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071222;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}.stage{position:relative;width:100vw;line-height:0;user-select:none}.stage img{display:block;width:100%;height:auto}.hotspot{position:absolute;display:block;z-index:5;cursor:pointer;border:0;background:transparent;text-decoration:none}.debug .hotspot{outline:2px solid rgba(255,70,70,.85);background:rgba(255,70,70,.12)}.debug .hotspot::after{content:attr(data-label);position:absolute;left:2px;top:2px;padding:2px 5px;line-height:1.2;font-size:10px;color:#fff;background:#d22;border-radius:3px;white-space:nowrap}.toolbar{position:fixed;z-index:20;right:14px;bottom:14px;display:flex;gap:6px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:12px;background:var(--bar);backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.32);transition:opacity .2s}.toolbar button,.toolbar a{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--text);font:600 12px/1 system-ui;padding:8px 10px;border-radius:8px;cursor:pointer;text-decoration:none}.toolbar button:hover,.toolbar a:hover{background:rgba(255,255,255,.16)}.toolbar .name{line-height:1.1;color:#dce7f5;font-size:11px;padding:0 6px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolbar .gold{color:#ffcf76}.toolbar.compact .name,.toolbar.compact .navbtn{display:none}.toolbar.compact{opacity:.2}.toolbar.compact:hover{opacity:1}@media(max-width:700px){.toolbar{right:8px;bottom:8px}.toolbar .name{display:none}}</style></head><body><main id="stage" class="stage"><img id="screen" decoding="async" fetchpriority="high"></main><div class="toolbar" id="toolbar"><a href="index.html" title="Zur Übersicht">⌂</a><button class="navbtn" id="prev">←</button><span class="name"><b class="gold" id="counter"></b> · <span id="screenName"></span></span><button class="navbtn" id="next">→</button><button id="debug" title="Hotspots anzeigen (Taste D)">◎</button><button id="hidebar">×</button></div><script>const CONFIG={title:'Backend A — Classic Media Desktop',start:'desktop',pages:{desktop:{label:'Media Desktop',file:'UI/ChatGPT Image 10. Sept. 2026, 19_14_14.png'},videos:{label:'Videos',file:'UI/ChatGPT Image 10. Sept. 2026, 19_14_21.png'},live:{label:'Live Studio',file:'UI/ChatGPT Image 10. Sept. 2026, 19_14_17.png'}},commonHotspots:[{x:0,y:6,w:13,h:6,target:'desktop',label:'Desktop'},{x:0,y:23,w:13,h:6,target:'videos',label:'Videos'},{x:0,y:28,w:13,h:6,target:'live',label:'Live Studio'}]};const cfg=CONFIG,stage=document.getElementById('stage'),img=document.getElementById('screen'),nameEl=document.getElementById('screenName'),counter=document.getElementById('counter'),keys=Object.keys(cfg.pages);let current='';function encPath(p){return p.split('/').map((s,i)=>i?encodeURIComponent(s):s).join('/')}function hs(a){const e=document.createElement('a');e.className='hotspot';e.href='#'+a.target;e.dataset.label=a.label||a.target;Object.assign(e.style,{left:a.x+'%',top:a.y+'%',width:a.w+'%',height:a.h+'%'});e.onclick=ev=>{ev.preventDefault();setPage(a.target)};stage.appendChild(e)}function renderHotspots(){stage.querySelectorAll('.hotspot').forEach(e=>e.remove());(cfg.commonHotspots||[]).forEach(hs)}function preload(i){[-1,1].forEach(d=>{const k=keys[i+d];if(k){const n=new Image;n.src=encPath(cfg.pages[k].file)}})}function setPage(k,push=true){if(!cfg.pages[k])k=keys[0];current=k;const p=cfg.pages[k],i=keys.indexOf(k);img.src=encPath(p.file);img.alt=p.label;nameEl.textContent=p.label;counter.textContent=(i+1)+'/'+keys.length;document.title=cfg.title+' — '+p.label;renderHotspots();if(push)history.replaceState(null,'','#'+k);preload(i)}function step(d){let i=(keys.indexOf(current)+d+keys.length)%keys.length;setPage(keys[i])}document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);document.getElementById('debug').onclick=()=>document.body.classList.toggle('debug');document.getElementById('hidebar').onclick=()=>document.getElementById('toolbar').classList.toggle('compact');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(e.key.toLowerCase()==='d')document.body.classList.toggle('debug');if(e.key==='Home')setPage(keys[0])});setPage(decodeURIComponent(location.hash.slice(1))||cfg.start,false)</script></body></html>
