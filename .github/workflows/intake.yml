name: Intake checks
on:
  push:
    paths: ['intake/**', 'upload/**', '.github/workflows/intake.yml']
  pull_request:
    paths: ['intake/**', 'upload/**', '.github/workflows/intake.yml']
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          find intake upload -name '*.php' -print0 | xargs -0 -n1 php -l
          bash -n intake/bin/deploy-plesk.sh
      - name: Archive recovery and storage checks
        run: |
          php intake/tests/archive.php
          php intake/tests/auth.php
      - name: Retired uploader HTTP checks
        run: node intake/tests/retirement.mjs
